seed: 0
run:
  mode: local
dataset:
  source: shapenet
  root: data/shapenet_voxels
  sample_categories: 10
  category_seed: 0
  max_shapes_per_class: 1
  target_size: 32
  occupancy_threshold: 0.5
  val_split: 0.1
  damage_radius_range: [2, 4]
  damage_types: [sphere, cube]
  num_damage_sites_range: [1, 2]
  min_damage_target_cells: 32
  max_damage_attempts: 10
  augment_rotations: false
model:
  type: combined
  num_hidden_channels: 48
  num_damage_directions: 7
  clip_range: 64.0
  use_tanh: false
  train_perception: false
training:
  epochs: 500
  batch_size: 8
  lr: 0.0002
  iterations_per_epoch: 100
  min_steps_per_sample: 96
  max_steps_per_sample: 128
  damage_loss_weight: 1.0
  class_loss_weight: 1.0
  damage_class_weight: 25.0
  damage_loss_type: cross_entropy
  focal_gamma: 2.0
  buffer_size: 1000
  buffer_sampling_prob: 0.2
  grad_clip: 1.0
  num_workers: 0
output:
  save_dir: combined_shapenet_nca_models
  save_frequency: 10
  validate_frequency: 1
  repo_id: shyamsn97/shapenet-cube-regen-combined-hdim-48
  repo_type: model
