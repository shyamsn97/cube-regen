seed: 0
run:
  mode: local
dataset:
  source: npy
  shapes_path: data/xdata_7class.npy
  labels_path: data/ydata_7class.npy
  damage_radius_range: [1, 3]
  damage_types: [sphere, cube, random]
  random_proportion_range: [0.1, 0.2]
  augment_rotations: false
  fixed_damage: false
  filter_label: 3
model:
  type: damage
  use_class_embeddings: true
  num_hidden_channels: 20
  num_damage_directions: 7
  clip_range: 64.0
  use_tanh: false
training:
  epochs: 500
  batch_size: 8
  lr: 0.00002
  iterations_per_epoch: 100
  steps_per_sample: 96
  buffer_size: 1000
  buffer_sampling_prob: 0.5
output:
  save_dir: nca_models
  save_frequency: 10
  visualization_frequency: 10
  repo_id: shyamsn97/table-cube-regen-damage-detection-txt-20
  repo_type: model
  model_repo_id: shyamsn97/table-cube-regen-damage-detection-20
