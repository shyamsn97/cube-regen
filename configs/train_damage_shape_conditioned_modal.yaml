seed: 0
run:
  mode: modal
  app_name: nca-3d-trainer
  detach: true
  gpu: A10G
  timeout_seconds: 75600
  secret_env: [HF_TOKEN, WANDB_API_KEY]
  requirements:
    - numpy
    - torch
    - tensorboard
    - matplotlib
    - wandb
    - Pillow
    - tqdm
    - huggingface_hub
    - PyYAML
dataset:
  source: npy
  shapes_path: data/xdata_7class.npy
  labels_path: data/ydata_7class.npy
  shape_seed: 0
  # max_shapes_per_class: 1
  damage_radius_range: [1, 3]
  damage_types: [sphere, cube]
  num_damage_sites_range: [1, 3]
  min_damage_target_cells: 8
  max_damage_attempts: 10
  augment_rotations: false
  fixed_damage: false
model:
  type: damage
  use_class_embeddings: false
  use_shape_conditioning: true
  shape_condition_channels: 8
  num_hidden_channels: 64
  num_damage_directions: 7
  clip_range: 64.0
  use_tanh: false
training:
  epochs: 500
  batch_size: 12
  lr: 0.002
  iterations_per_epoch: 100
  min_steps_per_sample: 64
  max_steps_per_sample: 96
  damage_class_weight: 25.0
  damage_loss_type: cross_entropy
  focal_gamma: 2.0
  buffer_size: 1000
  buffer_sampling_prob: 0.2
  grad_clip: 1.0
  gradient_checkpointing: false
  num_workers: 0
  wandb_project: nca-3d-damage
  wandb_run_name: npy-shape-conditioned-damage-hdim-full-64
  wandb_watch: true
  wandb_watch_log: all
  wandb_watch_log_freq: 100
  wandb_log_gradient_sums: true
  wandb_gradient_log_freq: 1
output:
  save_dir: shape_conditioned_damage_nca_models
  save_frequency: 10
  visualization_frequency: 10
  repo_id: shyamsn97/cube-regen-shape-conditioned-damage-hdim-full-64
  repo_type: model
