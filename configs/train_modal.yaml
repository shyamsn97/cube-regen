seed: 0
run:
  mode: modal
  app_name: nca-3d-trainer
  gpu: A10G
  timeout_seconds: 75600
  secret_env: [HF_TOKEN, WANDB_API_KEY]
  requirements:
    - numpy
    - torch
    - tensorboard
    - matplotlib
    - wandb
    - Pillow
    - tqdm
    - huggingface_hub
    - PyYAML
dataset:
  source: npy
  shapes_path: data/xdata_7class.npy
  labels_path: data/ydata_7class.npy
  val_split: 0.1
  damage_radius_range: [1, 3]
  damage_types: [sphere, cube, random]
  random_proportion_range: [0.1, 0.2]
  augment_rotations: false
model:
  type: combined
  num_hidden_channels: 20
  num_damage_directions: 7
  clip_range: 64.0
  use_tanh: false
  train_perception: false
training:
  epochs: 500
  batch_size: 8
  lr: 0.00002
  iterations_per_epoch: 100
  steps_per_sample: 96
  damage_loss_weight: 1.0
  class_loss_weight: 1.0
  buffer_size: 1000
  buffer_sampling_prob: 0.5
  grad_clip: 1.0
  num_workers: 0
output:
  checkpoint_dir: combined_nca_models
  save_frequency: 10
  validate_frequency: 1
