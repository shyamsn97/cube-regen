seed: 0
run:
  mode: modal
  app_name: nca-3d-trainer
  detach: true
  gpu: A10G
  timeout_seconds: 75600
  secret_env: [HF_TOKEN, WANDB_API_KEY]
  volumes:
    - name: shapenet-voxels
      mount_path: /data
      create_if_missing: true
  requirements:
    - numpy
    - torch
    - tensorboard
    - matplotlib
    - wandb
    - Pillow
    - tqdm
    - huggingface_hub
    - PyYAML
dataset:
  source: shapenet
  root: /data/shapenet_voxels
  archive_url: https://cvgl.stanford.edu/data2/ShapeNetVox32.tgz
  sample_categories: 10
  category_seed: 0
  shape_seed: 0
  max_shapes_per_class: 1
  target_size: 32
  occupancy_threshold: 0.5
  damage_radius_range: [1, 3]
  damage_types: [sphere, cube]
  num_damage_sites_range: [1, 2]
  min_damage_target_cells: 32
  max_damage_attempts: 10
  augment_rotations: false
  fixed_damage: false
model:
  type: damage
  use_class_embeddings: true
  num_hidden_channels: 48
  num_damage_directions: 7
  clip_range: 64.0
  use_tanh: false
training:
  epochs: 500
  batch_size: 4
  lr: 0.0002
  iterations_per_epoch: 100
  steps_per_sample: 64
  damage_class_weight: 25.0
  damage_loss_type: cross_entropy
  focal_gamma: 2.0
  buffer_size: 1000
  buffer_sampling_prob: 0.2
  grad_clip: 1.0
  gradient_checkpointing: true
output:
  save_dir: shapenet_damage_nca_models
  save_frequency: 20
  visualization_frequency: 10
  repo_id: shyamsn97/shapenet-cube-regen-damage-detection-txt-48
  repo_type: model
  model_repo_id: shyamsn97/shapenet-cube-regen-damage-detection-48