seed: 0
run:
  mode: modal
  app_name: nca-3d-trainer
  detach: true
  gpu: A10G
  timeout_seconds: 75600
  secret_env: [HF_TOKEN, WANDB_API_KEY]
  requirements:
    - numpy
    - torch
    - tensorboard
    - matplotlib
    - wandb
    - Pillow
    - tqdm
    - huggingface_hub
    - PyYAML
dataset:
  source: npy
  shapes_path: data/xdata_7class.npy
  labels_path: data/ydata_7class.npy
  val_split: 0.1
  damage_radius_range: [1, 3]
  damage_types: [sphere, cube]
  num_damage_sites_range: [1, 2]
  min_damage_target_cells: 8
  max_damage_attempts: 10
  augment_rotations: false
model:
  type: combined
  num_hidden_channels: 24
  num_damage_directions: 7
  clip_range: 64.0
  use_tanh: false
  train_perception: false
training:
  epochs: 500
  batch_size: 16
  lr: 0.0005
  iterations_per_epoch: 100
  steps_per_sample: 96
  damage_loss_weight: 1.0
  class_loss_weight: 1.0
  damage_class_weight: 25.0
  damage_loss_type: cross_entropy
  focal_gamma: 2.0
  buffer_size: 1000
  buffer_sampling_prob: 0.2
  grad_clip: 1.0
  num_workers: 0
  wandb_project: nca-3d-combined
  wandb_run_name: npy-combined-hdim-24-fast-damage
  wandb_watch: true
  wandb_watch_log: all
  wandb_watch_log_freq: 100
  wandb_log_gradient_sums: true
  wandb_gradient_log_freq: 1
output:
  checkpoint_dir: combined_nca_models
  save_frequency: 10
  validate_frequency: 1
  repo_id: shyamsn97/cube-regen-combined
  repo_type: model
